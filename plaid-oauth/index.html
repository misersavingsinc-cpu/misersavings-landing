<!doctype html>
<!--
  Miser — Plaid Hosted Link OAuth redirect page.

  Served at:  https://misersavings.com/plaid-oauth
  This is the top-level `redirect_uri` registered with Plaid (env var
  PLAID_DIRECT_OAUTH_REDIRECT_URI / PLAID_OAUTH_REDIRECT_URI) when
  hosted_link.is_mobile_app is set. It MUST be:
    1. registered in the Plaid dashboard's Allowed redirect URIs for the
       PRODUCTION environment (sandbox has no real OAuth) — done, team "Miser",
       client_id 69fce42e5b193d000d53a43d, and
    2. claimed in the AASA (see /.well-known/apple-app-site-association —
       the "/plaid-oauth" component), so iOS opens Miser directly instead of
       loading this page.

  When an OAuth bank (e.g. Chase) finishes, Plaid redirects the mobile
  browser here. If the universal link is caught by iOS, the app opens and this
  HTML never renders. If it isn't (app missing / link not claimed yet), this
  page loads and bounces to the app's completion scheme, forwarding Plaid's
  OAuth query params (oauth_state_id, …) so the Hosted Link session resumes.

  ⚠️  SCHEME: must match COMPLETE_REDIRECT in lib/plaidDirect.ts, which is what
  ASWebAuthenticationSession actually watches for. That is
  `misersavings://plaid-direct-complete`. Do NOT use
  `misersavings://hosted-link-complete` — that belongs to lib/plaidLink.ts,
  which is dead code (imported nowhere).

  History: this file lived only in misersavings-app/public/ until 2026-08-05 and
  was therefore never deployed — misersavings.com is served from THIS repo
  (misersavingsinc-cpu/misersavings-landing). The result was a 404 on every
  Chase OAuth return and no on-device bank link could ever complete. See
  misersavings-app/docs/banking/plaid-oauth-universal-link-broken-2026-08-05.md.

  Pure static HTML — no dependencies, safe to serve from any host/CDN.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Returning to Miser…</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      background: #14532d; color: #f5f5f0; text-align: center; padding: 24px;
    }
    .card { max-width: 360px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p  { font-size: 15px; line-height: 1.5; opacity: 0.9; margin: 0 0 24px; }
    a.button {
      display: inline-block; background: #f5f5f0; color: #14532d;
      text-decoration: none; font-weight: 700; font-size: 16px;
      padding: 14px 22px; border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Almost done</h1>
    <p>Returning you to Miser to finish linking&hellip;</p>
    <a id="return" class="button" href="misersavings://plaid-direct-complete">Return to Miser</a>
  </div>
  <script>
    // Forward Plaid's OAuth query params (oauth_state_id, link_correlation_id, …)
    // to the app so the Hosted Link session resumes where it left off.
    (function () {
      var scheme = 'misersavings://plaid-direct-complete' + (window.location.search || '');
      var link = document.getElementById('return');
      if (link) link.setAttribute('href', scheme);
      try { window.location.replace(scheme); } catch (e) {}
    })();
  </script>
</body>
</html>
