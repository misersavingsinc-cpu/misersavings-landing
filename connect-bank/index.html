<!doctype html>
<!--
  Miser — /connect-bank universal-link fallback.

  /connect-bank is claimed in /.well-known/apple-app-site-association, so on a
  device with Miser installed iOS opens the app and this page never renders.
  It exists so the URL does not 404 for anyone without the app (or when the
  universal link doesn't fire), and bounces to the app scheme first.

  Added 2026-08-05 — the path was claimed in the AASA but no page existed.
  Pure static HTML — no dependencies.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Connect your bank — Miser</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      background: #14532d; color: #f5f5f0; text-align: center; padding: 24px;
    }
    .card { max-width: 380px; }
    h1 { font-size:22px; margin: 0 0 8px; }
    p  { font-size:15px; line-height: 1.5; opacity: 0.9; margin: 0 0 24px; }
    a.button {
      display: inline-block; background: #f5f5f0; color: #14532d;
      text-decoration: none; font-weight: 700; font-size:16px;
      padding: 14px 22px; border-radius: 12px; margin: 0 6px 10px;
    }
    a.ghost {
      display: inline-block; color: #f5f5f0; text-decoration: underline;
      font-size:14px; opacity: 0.85;
    }
  </style>
<style id="a11y-fixes">
/* WCAG 2.1 AA pass — see misersavings-accessibility-review-2026-09-16.md */
.skip{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden}
.skip:focus{left:16px;top:12px;width:auto;height:auto;z-index:9999;padding:10px 16px;
  background:#F5F0E0;color:#1C3D2B;border-radius:6px;font-weight:700;font-size:13px;
  text-decoration:none;outline:3px solid #C8A820;outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid #C8A820;outline-offset:2px;border-radius:4px}
.wl-emailrow:focus-within{border-color:#C8A820!important;outline:3px solid #C8A820;outline-offset:2px}
.nav-links a,nav a,.foot-links a{padding-block:8px}
.nav-links a{padding-block:14px}
.cents{color:rgba(28,61,43,0.60)!important}

/* links on dark callout surfaces: --sg (#2E6B45) is a light-ground colour */
.callout-top a,.callout a,.dk a,.gui-dk a{color:#D4B428}
.callout-top a:hover,.callout a:hover{color:#EDE8D0}
/* gold on mid-green panels needs the brighter tint to clear 4.5:1 */
.wl-platform-label{color:#D4B428!important}
/* gold is a dark-surface colour; on cream/peach it reads as bronze */
.crm .eyebrow,.pch .eyebrow,.legal-inner .eyebrow{color:#7A5B10}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<main id="main">
  <div class="card">
    <h1>Open Miser to connect your bank</h1>
    <p>Bank linking happens inside the Miser app.</p>
    <a id="open" class="button" href="misersavings://connect-bank">Open Miser</a>
    <div><a class="ghost" href="/">Back to misersavings.com</a></div>
  </div>
  <script>
    (function () {
      var scheme = 'misersavings://connect-bank' + (window.location.search || '');
      var link = document.getElementById('open');
      if (link) link.setAttribute('href', scheme);
      try { window.location.replace(scheme); } catch (e) {}
    })();
  </script>
</main>
</body>
</html>
